<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="My projects">
  <title>Projects</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/style.css">
  <script src="/assets/projects.js" defer></script>
</head>
<body>
  <main class="projects-page">
    <header class="projects-header">
      <a class="back-link" href="/">Back</a>
      <h1>Projects</h1>
    </header>

    <section class="projects" aria-labelledby="projects-list-title" hidden>
      <div class="project-grid"></div>
    </section>

    <dialog class="project-dialog" aria-labelledby="project-dialog-title" aria-describedby="project-dialog-description">
      <div class="project-dialog-header">
        <h2 id="project-dialog-title"></h2>
        <button class="project-dialog-close" type="button" aria-label="Close project details">Close</button>
      </div>
      <p id="project-dialog-description" class="project-dialog-description"></p>
      <p class="project-dialog-stack"></p>
      <a class="project-dialog-link" href=""></a>
    </dialog>
  </main>
</body>
</html>
